<!doctype html>
<html lang="pt">
	<head>
		<meta charset="UTF-8" />

		<!-- Viewport e responsividade -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- SEO Básico -->
		<title>Tomás Frazão | Aluno de Informática</title>
		<meta
			name="description"
			content="Portfólio de Tomás Frazão — aluno de informática no ensino técnico e programador em formação, autor do projeto Tree Maker."

			name="keywords"
			content="Tomás Frazão, programador, portfólio, desenvolvedor, frontend, React, TypeScript, Discord bots"

		<!-- Favicon -->
		<link rel="icon" type="image/svg+xml" href="/tf-mark.svg" />
		<link
			rel="alternate icon"
			type="image/png"
			sizes="32x32"
			href="/tomas_frazao_logo.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/tomas_frazao_logo.png"
		/>
		<link rel="manifest" href="/manifest.json" />

		<!-- Open Graph (para Facebook, LinkedIn, etc.) -->
		<meta property="og:type" content="website" />
		<meta
			property="og:title"
			content="Tomás Frazão | Aluno de Informática"
		/>
		<meta
			property="og:description"
			content="Explora o trabalho, projetos e experiências web de Tomás Frazão."
		/>
		<meta property="og:image" content="/tomas_frazao_banner.png" />
		<meta property="og:url" content="https://tomasfrazao.pt" />
		<meta property="og:site_name" content="Tomás Frazão" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:title"
			content="Tomás Frazão | Aluno de Informática"
		/>
		<meta
			name="twitter:description"
			content="Explora os projetos e competências de Tomás Frazão no desenvolvimento web."
		/>
		<meta name="twitter:image" content="/tomas_frazao_banner.png" />
		<meta name="twitter:creator" content="@tomfraza0" />

		<meta name="theme-color" content="#17211e" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<meta name="apple-mobile-web-app-title" content="Tomás Frazão" />

		<!-- Robots e Acessibilidade -->
		<meta name="robots" content="index, follow" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />

	<body>
